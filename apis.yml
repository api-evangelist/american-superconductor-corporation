name: American Superconductor Corporation
description: 'American Superconductor Corporation (AMSC) is a Ayer, Massachusetts based power systems
  company that designs and deploys grid interconnection, power protection, and power supply solutions
  for the energy, renewables, industrial, utility, and military sectors. Its portfolio spans grid systems
  such as D-VAR dynamic reactive compensation and STATCOM, ship protection and degaussing systems for
  naval defense, wind turbine electrical control systems, and Amperium high-temperature superconductor
  wire. AMSC was surfaced as a portfolio company of kleiner-perkins and added to the API Evangelist
  network. This is a public-company / hardtech profile with no public developer API surface; the
  enrichment pass captured domain-security posture and corporate link properties only.'
